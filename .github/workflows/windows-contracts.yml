name: Windows contract audit

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: windows-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contract snapshots and fixtures
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Show Python
        run: python --version

      - name: Validate contracts
        run: python -B tools/validate_contracts.py --check
